nodeLinker: node-modules

# Exact releases required for Arc 23 verification and motion compatibility.
# Keep Yarn's default release-age guard for every other package/version.
npmPreapprovedPackages:
    - '@cratis/arc@23.0.0'
    - '@cratis/arc.react@23.0.0'
    - '@cratis/arc.vite@23.0.0'
    # Matching motion releases required to fix the missing observeTimeline export (#390).
    - 'framer-motion@13.5.0'
    - 'motion-dom@13.5.0'
    - 'motion-utils@13.5.0'

packageExtensions:
    '@primereact/headless@11.1.0':
        dependencies:
            react: '19.2.8'
    '@primereact/styles@11.1.0':
        dependencies:
            '@primeuix/motion': '1.0.0'
    '@primereact/ui@11.1.0':
        dependencies:
            '@primereact/core': '11.1.0'
            react-dom: '19.2.8'
    '@storybook/addon-vitest@10.6.0':
        dependencies:
            react: '19.3.0'
    'storybook@10.6.0':
        dependencies:
            react: '19.3.0'

pnpMode: loose

compressionLevel: mixed

enableGlobalCache: false

enableImmutableInstalls: false

yarnPath: .yarn/releases/yarn-4.17.1.cjs
