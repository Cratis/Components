name: JavaScript Build

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
        type: choice
        options:
        - info
        - warning
        - debug
  push:
    branches:
      - "main"
    paths:
      - "Source/**"
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}
  
      - name: Yarn install
        run: yarn

      - name: Build JS/TS
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn ci

  # Builds the artifact that actually ships to npm (the `prepare` script: tsc -b +
  # rollup + copy-css) and loads every subpath of the `exports` map from it.
  #
  # The `build` job above only runs `tsc -p tsconfig.json`, so nothing in CI has ever
  # imported the published shape. That gap is how Cratis/Components#118 - the published
  # ESM contains directory imports, so no node-environment spec can render Dialog or
  # CommandDialog - reached a release unnoticed.
  #
  # REPORTING ONLY - this job is expected to be RED today; being red is the point,
  # it reproduces #118. It must not block merges until the two underlying causes are
  # fixed: PrimeReact 11 (#107) for the bare `primereact/*` directory imports, and the
  # CSS side-effect imports that rollup externalises via /\.css$/ (independent of #107).
  # Once both are resolved, drop `continue-on-error` to make this a real publish gate.
  verify-published-exports:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 23.x
          registry-url: "https://registry.npmjs.org"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: |
            .yarn/cache
            **/node_modules
            **/.eslintcache
            **/yarn.lock
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/package.json') }}

      - name: Yarn install
        run: yarn

      - name: Build the published artifact
        working-directory: Source
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          yarn run prepare

      - name: Verify published exports
        working-directory: Source
        run: node scripts/verify-exports.mjs
