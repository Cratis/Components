name: Update Packages

on:
  workflow_dispatch:

permissions: {}

jobs:
  block:
    name: Block direct dependency updates
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Explain reviewed dependency update requirement
        run: |
          echo "::error::Dependency updates must be made through a reviewed pull request containing both manifest changes and the committed root yarn.lock."
          exit 1
