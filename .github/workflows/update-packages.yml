name: Update Packages

# Keep scheduled runs paused until a safe PR-only run has been verified.
# Dependency PRs still require the renderer and package-manager checks before merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require automation App configuration
        shell: bash
        env:
          APP_ID: ${{ vars.CRATIS_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Dependency updates require CRATIS_AUTOMATION_APP_ID and AUTOMATION_APP_PRIVATE_KEY; fallback credentials are not allowed."
            exit 1
          fi

  update:
    needs: preflight
    uses: Cratis/Workflows/.github/workflows/update-packages.yml@main
    with:
      publication-mode: pull-request
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
