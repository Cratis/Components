name: Publish

# Maintenance releases for Components 3.x. This file keeps the name `publish.yml` so npm trusted
# publishing, which is bound to the workflow file, accepts it. It runs only when dispatched on
# support/3.x, publishes under the v3-lts dist-tag so npm `latest` stays on the current major,
# and creates a plain git tag rather than a GitHub release, because the release action on main
# computes the next version from the latest GitHub release.

on:
    workflow_dispatch:
        inputs:
            version:
                description: '3.x version to publish, for example 3.6.2'
                required: true
                type: string

concurrency:
    group: publish-support-3x
    cancel-in-progress: false

env:
    NPM_PUBLISH_TAG: v3-lts

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: write
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Validate the maintenance version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  if [[ "$GITHUB_REF" != "refs/heads/support/3.x" ]]; then
                    echo "::error::Maintenance releases are dispatched on support/3.x, not $GITHUB_REF."
                    exit 1
                  fi
                  if [[ ! "$VERSION" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::'$VERSION' is not a 3.x version."
                    exit 1
                  fi
                  if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
                    echo "::error::v$VERSION is already tagged."
                    exit 1
                  fi
                  highest=$(git tag -l 'v3.*' | sed 's/^v//' | sort -V | tail -1)
                  if [[ "$(printf '%s\n%s\n' "$highest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
                    echo "::error::$VERSION is not newer than the highest 3.x tag v$highest."
                    exit 1
                  fi
                  echo "Publishing $VERSION under dist-tag $NPM_PUBLISH_TAG (highest existing 3.x tag: v$highest)."

            - name: Setup node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  registry-url: 'https://registry.npmjs.org'

            - name: Configure npm for OIDC-based publishing
              run: |
                  # setup-node writes _authToken=${NODE_AUTH_TOKEN} into .npmrc. npm would use
                  # that entry instead of OIDC trusted publishing, so delete it and make sure
                  # NODE_AUTH_TOKEN is empty.
                  sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
                  echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

            - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
              run: |
                  npm install -g npm@11
                  node -e "
                    const [major, minor, patch] = '$(npm --version)'.split('.').map(Number);
                    if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
                      console.error('npm >= 11.5.1 is required for trusted publishing');
                      process.exit(1);
                    }
                  "

            - name: Enable Corepack
              run: corepack enable

            - name: Yarn install
              run: yarn install --immutable

            - name: Build, lint and test
              run: yarn ci

            - name: Publish NPM packages
              env:
                  VERSION: ${{ inputs.version }}
              run: yarn publish-version "$VERSION"

            - name: Verify the release and that latest stayed on the current major
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  failed=0
                  for name in @cratis/components @cratis/eslint-plugin-components; do
                    published=""
                    for attempt in 1 2 3 4 5 6; do
                      published=$(npm view "$name@$VERSION" version 2>/dev/null || true)
                      [[ "$published" == "$VERSION" ]] && break
                      sleep 10
                    done
                    tag=$(npm view "$name" "dist-tags.$NPM_PUBLISH_TAG" 2>/dev/null || true)
                    latest=$(npm view "$name" dist-tags.latest)
                    echo "$name: published=$published $NPM_PUBLISH_TAG=$tag latest=$latest"
                    if [[ "$published" != "$VERSION" || "$tag" != "$VERSION" ]]; then
                      echo "::error::$name@$VERSION is not on the registry under $NPM_PUBLISH_TAG."
                      failed=1
                    fi
                    if [[ "$latest" == 3.* ]]; then
                      echo "::error::$name latest moved to $latest; restore it with npm dist-tag add $name@<current 4.x> latest."
                      failed=1
                    fi
                  done
                  exit $failed

            - name: Tag the release
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  git reset --hard
                  git tag "v$VERSION"
                  git push origin "v$VERSION"
