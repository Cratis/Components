name: Publish

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to release'
                required: true
                default: '0.0.0'
                type: string
            release-notes:
                description: 'Release notes'
                required: true
                default: 'No release notes'
                type: string
            logLevel:
                description: 'Log level'
                required: true
                default: 'warning'
                type: choice
                options:
                    - info
                    - warning
                    - debug
    # Releasing on push rather than on the pull_request closed event is deliberate. A pull request from a fork
    # runs with a read-only GITHUB_TOKEN and no secrets even on merge, so it cannot create the release or reach
    # the publishing credentials - which is how a merged, labeled fork contribution silently released nothing.
    # A push to main always runs with a full-permission token, and the release action finds the merged pull
    # request and its label from the commit.
    push:
        # Only main releases. On "**" every base branch released, so merging one pull
        # request into another one's branch - the ordinary way to stack work - cut and published a version
        # from a branch that was still in review. That is how Cratis.Fundamentals v7.17.0 came to be
        # published from the head of an open pull request, carrying every unmerged change on that branch
        # under release notes describing only the one that had just merged. A release must come from the
        # branch that is released.
        branches:
            - main

permissions:
    contents: read
    pull-requests: read

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: write
            issues: write
            pull-requests: read
        outputs:
            version: ${{ steps.release.outputs.version }}
            publish: ${{ steps.release.outputs.should-publish }}
            reason: ${{ steps.release.outputs.reason }}

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # Older majors are released from their support branch (see release.md). A version from
            # an older major dispatched here would create its GitHub release on main.
            - name: Refuse a dispatched version from an older major
              if: github.event_name == 'workflow_dispatch'
              env:
                  VERSION: ${{ github.event.inputs.version }}
              run: |
                  set -euo pipefail
                  [[ "$VERSION" == "0.0.0" ]] && exit 0
                  if [[ ! "$VERSION" =~ ^([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::'$VERSION' is not a version."
                    exit 1
                  fi
                  requested_major="${BASH_REMATCH[1]}"
                  current_major=$(node -p "require('./Source/package.json').version.split('.')[0]")
                  if [[ ! "$current_major" =~ ^[0-9]+$ ]]; then
                    echo "::error::Could not read the current major from Source/package.json."
                    exit 1
                  fi
                  if (( 10#$requested_major < 10#$current_major )); then
                    echo "::error::$VERSION belongs to an older major; dispatch publish.yml on its support branch instead."
                    exit 1
                  fi

            - name: Release
              id: release
              uses: cratis/release-action@f5fc6db6adbb4db6e6c4548cd7addfc924426e69 # v1
              with:
                  version: ${{ github.event.inputs.version }}
                  release-notes: ${{ github.event.inputs.release-notes }}

    publish-npm-packages:
        if: needs.release.outputs.publish == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '0.0.0')
        runs-on: ubuntu-latest
        timeout-minutes: 60
        needs: [release]
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  registry-url: 'https://registry.npmjs.org'

            - name: Configure npm for OIDC-based publishing
              run: |
                  # setup-node writes _authToken=${NODE_AUTH_TOKEN} into .npmrc. npm would use
                  # that entry instead of OIDC trusted publishing, so delete it and make sure
                  # NODE_AUTH_TOKEN is empty.
                  sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
                  echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
                  echo "--- .npmrc after stripping placeholder ---"
                  cat "$NPM_CONFIG_USERCONFIG"

            - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
              run: |
                  npm install -g npm@11
                  NPM_VER="$(npm --version)"
                  echo "Installed npm $NPM_VER"
                  node -e "
                    const v = '$NPM_VER'.split('.').map(Number);
                    if (v[0] < 11 || (v[0] === 11 && v[1] < 5) || (v[0] === 11 && v[1] === 5 && v[2] < 1)) {
                      console.error('npm >= 11.5.1 is required for trusted publishing, got $NPM_VER');
                      process.exit(1);
                    }
                  "

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: yarn-cache
              with:
                  path: |
                      .yarn/cache
                      **/node_modules
                      **/.eslintcache
                  # The same key as the build, which the lockfile is part of. Never cache yarn.lock
                  # itself: a restore would replace the checked-out lockfile with a stale one.
                  key: ${{ runner.os }}-yarn-v2-${{ hashFiles('yarn.lock', '**/package.json', '.yarnrc.yml', '.yarn/releases/yarn-4.17.1.cjs') }}

            - name: Yarn install
              run: yarn install --immutable

            - name: Publish NPM packages
              env:
                  RELEASE_VERSION: ${{ needs.release.outputs.version || github.event.inputs.version }}
              run: |
                  echo "npm $(npm --version) | node $(node --version)"
                  if [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
                    echo 'ACTIONS_ID_TOKEN_REQUEST_URL is set'
                  else
                    echo 'ACTIONS_ID_TOKEN_REQUEST_URL is NOT set'
                  fi
                  echo "NODE_AUTH_TOKEN is '${NODE_AUTH_TOKEN:-(unset)}'"
                  echo "--- .npmrc ---"
                  cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null || echo "(no .npmrc)"
                  echo "---"
                  yarn workspace @cratis/components prepare
                  # A consumer resolves dependency ranges to the newest releases, not this lockfile.
                  yarn workspace @cratis/components verify-packed-fresh-dependencies
                  yarn build
                  yarn publish-version "$RELEASE_VERSION"

            # npm prints its success line per workspace, but that is not evidence the registry received
            # the package. On v4.5.0 two of four workspaces were missing for over an hour while this run
            # stayed green, and the published adapters referenced a core version nobody could install.
            # Ask the registry itself, in the job that published, so the answer cannot be skipped.
            - name: Verify every published package reached the registry
              env:
                  RELEASE_VERSION: ${{ needs.release.outputs.version || github.event.inputs.version }}
              run: |
                  missing=()
                  for manifest in Source/package.json ESLint/package.json Migrator/package.json Conformance/package.json Adapters/*/package.json; do
                    if [[ ! -f "$manifest" ]]; then
                      continue
                    fi
                    name=$(jq -r '.name' "$manifest")
                    if [[ "$(jq -r '.private // false' "$manifest")" == 'true' ]]; then
                      continue
                    fi
                    encoded=${name/\//%2f}
                    published=false
                    # npm's own read path can trail a successful publish by minutes for the larger
                    # packages: on 4.5.1 five workspaces answered at once and @cratis/components arrived
                    # after this loop had given up. Wait out ordinary propagation — the failure this
                    # guards against left a package missing for over an hour, so ten minutes still
                    # separates a slow registry from one that never received the publish.
                    for attempt in $(seq 1 30); do
                      if curl -sf "https://registry.npmjs.org/${encoded}/${RELEASE_VERSION}" > /dev/null; then
                        published=true
                        break
                      fi
                      sleep 20
                    done
                    if [[ "$published" == 'true' ]]; then
                      echo "${name}@${RELEASE_VERSION} is on the registry."
                    else
                      missing+=("${name}@${RELEASE_VERSION}")
                    fi
                  done
                  if [[ ${#missing[@]} -gt 0 ]]; then
                    echo "::error::The registry has no ${missing[*]}. The release tag exists but consumers cannot install it; re-run this job."
                    exit 1
                  fi

            - name: Trigger Documentation Build
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
              with:
                  token: ${{ secrets.PAT_DOCUMENTATION }}
                  repository: cratis/documentation
                  event-type: build-docs

            - name: Trigger Dependency Updates on Sample Repository
              uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
              with:
                  token: ${{ secrets.PAT_DOCUMENTATION }}
                  repository: cratis/samples
                  event-type: update-dependencies

    verify-published:
        # A merge that publishes nothing is the failure mode that silently costs a release: the release job
        # succeeds, every publish job is skipped for want of should-publish, and the whole run reports green. Fail
        # instead, so a release that did not happen cannot be mistaken for one that did.
        #
        # Only for the reasons that mean something went wrong. Publishing nothing is correct and routine for the
        # others - a commit pushed straight to main, a Dependabot merge, a re-run of a run that already released -
        # and failing on those would make this job noise that everyone learns to ignore.
        if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
        runs-on: ubuntu-latest
        timeout-minutes: 60
        needs: [release]

        steps:
            - name: Verify an intentional no-release merge
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  reason='${{ needs.release.outputs.reason }}'
                  if [[ "$reason" == 'error' ]]; then
                    echo '::error::The release action failed; no-release cannot suppress a release error.'
                    exit 1
                  fi

                  pulls=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
                  merged_count=$(printf '%s' "$pulls" | jq --arg sha "$GITHUB_SHA" '[.[] | select(.merge_commit_sha == $sha)] | length')
                  if [[ "$merged_count" -ne 1 ]]; then
                    echo "::error::Expected exactly one pull request whose merge commit is $GITHUB_SHA; found $merged_count."
                    exit 1
                  fi
                  no_release=$(printf '%s' "$pulls" | jq -r --arg sha "$GITHUB_SHA" \
                    '[.[] | select(.merge_commit_sha == $sha) | .labels[].name] | any(. == "no-release")')

                  if [[ "$no_release" == 'true' ]]; then
                    echo 'The merged pull request explicitly selected no-release; publishing nothing is the intended result.'
                    exit 0
                  fi

                  echo "::error::Nothing was published and no release was cut (reason: $reason). Add exactly one release-intent label before merge; use no-release when publishing nothing is intentional."
                  exit 1
