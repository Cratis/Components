name: Publish

# Maintenance releases for Components 3.x. Dispatch it on support/3.x:
#   gh workflow run publish.yml --ref support/3.x -f version=3.x.y
# It keeps the name `publish.yml` so npm trusted publishing, which is bound to the workflow file,
# accepts it. It publishes under the v3-lts dist-tag, so npm `latest` stays on the current major,
# and pushes a plain git tag without a GitHub release, so GitHub never marks a 3.x release as the
# repository's latest release. Publishing skips packages already on the registry, so re-running
# a failed run continues where it stopped.

on:
    workflow_dispatch:
        inputs:
            version:
                description: '3.x version to publish, for example 3.6.2'
                required: true
                type: string

concurrency:
    group: publish-support-3x
    cancel-in-progress: false

env:
    NPM_PUBLISH_TAG: v3-lts
    VERSION: ${{ inputs.version }}

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        # Install, tests and the prepare script run third-party code; this job cannot write to
        # the repository.
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate the maintenance version
              run: |
                  set -euo pipefail
                  if [[ "$GITHUB_REF" != "refs/heads/support/3.x" ]]; then
                    echo "::error::Maintenance releases are dispatched on support/3.x, not $GITHUB_REF."
                    exit 1
                  fi
                  if [[ ! "$VERSION" =~ ^3\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error::'$VERSION' is not a 3.x version."
                    exit 1
                  fi
                  if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
                    echo "::error::v$VERSION is already tagged."
                    exit 1
                  fi
                  highest=$(git tag -l 'v3.*' | sed 's/^v//' | sort -V | tail -1)
                  if [[ "$(printf '%s\n%s\n' "$highest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]]; then
                    echo "::error::$VERSION is not newer than the highest 3.x tag v$highest."
                    exit 1
                  fi
                  echo "Publishing $VERSION under dist-tag $NPM_PUBLISH_TAG (highest existing 3.x tag: v$highest)."

            - name: Setup node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24.x
                  registry-url: 'https://registry.npmjs.org'

            - name: Configure npm for OIDC-based publishing
              run: |
                  # setup-node writes _authToken=${NODE_AUTH_TOKEN} into .npmrc. npm would use
                  # that entry instead of OIDC trusted publishing, so delete it and make sure
                  # NODE_AUTH_TOKEN is empty.
                  sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
                  echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

            - name: Upgrade npm for trusted publishing (requires >= 11.5.1)
              run: |
                  npm install -g npm@11
                  node -e "
                    const [major, minor, patch] = '$(npm --version)'.split('.').map(Number);
                    if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
                      console.error('npm >= 11.5.1 is required for trusted publishing');
                      process.exit(1);
                    }
                  "

            - name: Enable Corepack
              run: corepack enable

            - name: Yarn install
              run: yarn install --immutable

            - name: Build, lint and test
              run: yarn ci

            - name: Publish NPM packages
              run: yarn publish-version "$VERSION"

    verify:
        needs: publish
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read

        steps:
            - name: Verify the release and that latest stayed on the current major
              run: |
                  set -euo pipefail
                  failed=0
                  for name in @cratis/components @cratis/eslint-plugin-components; do
                    # The registry's read path can lag a successful publish by minutes; separate a
                    # slow registry from one that never received the publish.
                    published=""
                    tagged=""
                    for _ in $(seq 1 30); do
                      published=$(npm view "$name@$VERSION" version 2>/dev/null || true)
                      tagged=$(npm view "$name" "dist-tags.$NPM_PUBLISH_TAG" 2>/dev/null || true)
                      [[ "$published" == "$VERSION" && "$tagged" == "$VERSION" ]] && break
                      sleep 20
                    done
                    latest=$(npm view "$name" dist-tags.latest)
                    echo "$name: published=$published $NPM_PUBLISH_TAG=$tagged latest=$latest"
                    if [[ "$published" != "$VERSION" || "$tagged" != "$VERSION" ]]; then
                      echo "::error::$name@$VERSION is not on the registry under $NPM_PUBLISH_TAG."
                      failed=1
                    fi
                    if [[ "$latest" == 3.* ]]; then
                      echo "::error::$name latest moved to $latest; restore it with npm dist-tag add $name@<current 4.x> latest."
                      failed=1
                    fi
                  done
                  exit $failed

    tag:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Tag the release
              run: |
                  git tag "v$VERSION" "$GITHUB_SHA"
                  git push origin "v$VERSION"
