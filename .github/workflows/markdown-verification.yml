name: Markdown Verification

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - '.github/workflows/markdown-verification.yml'
            - '.markdownlint.json'
            - 'Documentation/**'
            - 'README.md'
            - 'release.md'
            - 'Source/*.md'
            - 'Migrator/*.md'
            - 'ESLint/*.md'
            - 'Conformance/*.md'
            - 'Adapters/**/*.md'
            - 'Storybook/*.md'
            - 'scripts/*.md'
    pull_request:
        branches:
            - '**'
        paths:
            - '.github/workflows/markdown-verification.yml'
            - '.markdownlint.json'
            - 'Documentation/**'
            - 'README.md'
            - 'release.md'
            - 'Source/*.md'
            - 'Migrator/*.md'
            - 'ESLint/*.md'
            - 'Conformance/*.md'
            - 'Adapters/**/*.md'
            - 'Storybook/*.md'
            - 'scripts/*.md'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    markdown-verification:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 23.x

            # Run the same entry point contributors use locally so linting,
            # authoring validation, and local-link checks cannot drift apart.
            - name: Check Markdown and MDX authoring
              run: ./Documentation/verify-markdown.sh

            - name: Check external links in consumer documentation
              uses: JustinBeckwith/linkinator-action@7b6b0bc671f6264e1a8daa4488a5bd91ce61dcd4 # v2.4.2
              with:
                  paths: |
                      README.md
                      release.md
                      Source/*.md
                      Migrator/*.md
                      ESLint/*.md
                      Conformance/*.md
                      Adapters/**/*.md
                      Storybook/*.md
                      scripts/*.md
                      Documentation/**/*.md
                      Documentation/**/*.mdx
                  markdown: true
                  recurse: true
                  # Avoid GitHub's unauthenticated burst limit while checking several immutable
                  # repository links. Retry 429 responses carrying Retry-After; treat any remaining
                  # 429 as a transient warning rather than a broken-link result.
                  concurrency: 2
                  # `retry` covers a 429 carrying Retry-After. GitHub also answers a burst with a
                  # plain 504 or a dropped connection, which no status-code rule can turn into a
                  # verdict about the link — one failed that way on #294 while every other link to
                  # the same host answered 200. `retryErrors` retries those instead of reporting a
                  # live page as broken.
                  retry: true
                  retryErrors: true
                  retryErrorsCount: 3
                  statusCodes: '{"429":"warn"}'
                  # Stable Cratis repository anchors repeatedly trigger GitHub's unauthenticated
                  # rate limiting, which arrives as a 404 as often as a 429 — so neither `retry` nor
                  # the 429 rule above catches it, and a link that returned 200 minutes earlier fails
                  # the build. Every link back into THIS repository is skipped here, on any ref: the
                  # local checker above already resolves those paths against the working tree, which
                  # is the stronger check anyway, since it sees the branch's own content rather than
                  # whatever GitHub has published. Scoping the skip to `tree/main` (as it was) left
                  # every pull request checking a `tree/<branch>` URL that only exists to be throttled.
                  linksToSkip: '^http:\/\/(localhost|127\.0\.0\.1):\d+\/(arc|components|chronicle|event-modeling|build-a-full-app)(\/|$), ^https:\/\/www\.npmjs\.com\/, ^https:\/\/github\.com\/Cratis\/Components\/(blob|tree)\/, ^https:\/\/github\.com\/Cratis\/\.github\/blob\/main\/contributing\.md$'
