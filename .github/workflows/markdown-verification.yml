name: Markdown Verification

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - '.github/workflows/markdown-verification.yml'
            - '.markdownlint.json'
            - 'Documentation/**'
            - 'README.md'
            - 'release.md'
            - 'Source/*.md'
            - 'Migrator/*.md'
            - 'ESLint/*.md'
            - 'Conformance/*.md'
            - 'Adapters/**/*.md'
            - 'Storybook/*.md'
            - 'scripts/*.md'
    pull_request:
        branches:
            - '**'
        paths:
            - '.github/workflows/markdown-verification.yml'
            - '.markdownlint.json'
            - 'Documentation/**'
            - 'README.md'
            - 'release.md'
            - 'Source/*.md'
            - 'Migrator/*.md'
            - 'ESLint/*.md'
            - 'Conformance/*.md'
            - 'Adapters/**/*.md'
            - 'Storybook/*.md'
            - 'scripts/*.md'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    markdown-verification:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Setup node
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: 23.x

            # Run the same entry point contributors use locally so linting,
            # authoring validation, and local-link checks cannot drift apart.
            - name: Check Markdown and MDX authoring
              run: ./Documentation/verify-markdown.sh

            - name: Check external links in consumer documentation
              uses: JustinBeckwith/linkinator-action@7b6b0bc671f6264e1a8daa4488a5bd91ce61dcd4 # v2.4.2
              with:
                  paths: |
                      README.md
                      release.md
                      Source/*.md
                      Migrator/*.md
                      ESLint/*.md
                      Conformance/*.md
                      Adapters/**/*.md
                      Storybook/*.md
                      scripts/*.md
                      Documentation/**/*.md
                      Documentation/**/*.mdx
                  markdown: true
                  recurse: true
                  # Avoid GitHub's unauthenticated burst limit while checking several immutable
                  # repository links. Retry 429 responses carrying Retry-After; treat any remaining
                  # 429 as a transient warning rather than a broken-link result.
                  concurrency: 2
                  retry: true
                  statusCodes: '{"429":"warn"}'
                  # Stable Cratis repository anchors repeatedly trigger GitHub's unauthenticated
                  # 429 limit; current-tree links are verified locally above, so skip only exact
                  # current/immutable documentation paths and organization guidance here.
                  linksToSkip: '^http:\/\/(localhost|127\.0\.0\.1):\d+\/(arc|components|chronicle|event-modeling|build-a-full-app)(\/|$), ^https:\/\/www\.npmjs\.com\/, ^https:\/\/github\.com\/Cratis\/Components\/blob\/[0-9a-f]{40}\/Documentation\/, ^https:\/\/github\.com\/Cratis\/Components\/tree\/main\/Documentation\/, ^https:\/\/github\.com\/Cratis\/\.github\/blob\/main\/contributing\.md$'
