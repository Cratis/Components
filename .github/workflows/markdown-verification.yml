name: Markdown Verification

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'Documentation/**'
            - 'README.md'
            - 'Source/*.md'
            - 'Codemods/*.md'
            - 'ESLint/*.md'
    pull_request:
        branches:
            - '**'
        paths:
            - 'Documentation/**'
            - 'README.md'
            - 'Source/*.md'
            - 'Codemods/*.md'
            - 'ESLint/*.md'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    markdown-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Lint Markdown files
              uses: DavidAnson/markdownlint-cli2-action@v18
              with:
                  globs: |
                      README.md
                      Documentation/**/*.md
                      Documentation/**/*.mdx
                      Source/*.md
                      Codemods/*.md
                      ESLint/*.md

    link-verification:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 23.x

            - name: Check repository-local Markdown and MDX links
              run: node Documentation/verify-local-links.mjs Documentation

            - name: Check external links in consumer documentation
              uses: JustinBeckwith/linkinator-action@v1
              with:
                  paths: |
                      README.md
                      Source/*.md
                      Codemods/*.md
                      ESLint/*.md
                      Documentation/**/*.md
                      Documentation/**/*.mdx
                  markdown: true
                  recurse: true
                  # Avoid GitHub's unauthenticated burst limit while checking several immutable
                  # repository links; retry remains enabled for 429 responses with Retry-After.
                  concurrency: 2
                  retry: true
                  # Stable Cratis repository anchors repeatedly trigger GitHub's unauthenticated
                  # 429 limit; current-tree links are verified locally above, so skip only exact
                  # organization guidance and immutable historical evidence anchors here.
                  linksToSkip: '^http:\/\/(localhost|127\.0\.0\.1):\d+\/(arc|components|chronicle|event-modeling|build-a-full-app)(\/|$), ^https:\/\/www\.npmjs\.com\/, ^https:\/\/github\.com\/Cratis\/Components\/blob\/[0-9a-f]{40}\/Documentation\/, ^https:\/\/github\.com\/Cratis\/\.github\/blob\/main\/contributing\.md$'
